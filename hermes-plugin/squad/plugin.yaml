name: squad
version: 1.0.0
description: >-
  Quad Squad colony coordination for Hermes Agent terminals: file-based agent
  registry, peer inbox, cooperative file reservations, a shared task board
  with guard enforcement, and per-agent instruction injection. Inert unless
  launched by the Quad Squad app (SQUAD_AGENT/SQUAD_PROJECT/SQUAD_ROOT set).
kind: standalone
provides_tools:
  - squad_message
  - squad_claims
  - squad_board
  - squad_tasks
  - squad_roster
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - post_llm_call
  - on_session_start
  - on_session_end
